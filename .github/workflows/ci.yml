name: CI

# Code-quality gate: lint + tests on every push and pull request.
#
# This is intentionally separate from retrain.yml (which fetches live data and
# trains a model on a schedule). CI does NO network I/O — every test mocks the
# fetch functions and the model — so it is fast and deterministic.
#
# Reproducibility: dependencies are installed from the fully-pinned
# requirements.lock (see 5.6 in PROJECT_PLAN.txt), so a transitive dependency
# bump can't silently change or break a run.

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel an in-progress run if the same ref is pushed again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.lock already contains the runtime deps AND the dev
          # tools (pytest, ruff, httpx), fully pinned — one install does it all.
          pip install -r requirements.lock

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest
