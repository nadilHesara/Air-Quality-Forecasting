name: Weekly model retrain

# Automated retraining for the next-day PM2.5 model.
#
# Triggers:
#   * schedule  — weekly cron (UTC). The canonical schedule lives in
#                 config.py as RETRAIN_CRON; the literal below must match it
#                 (GitHub parses the cron from YAML, so it can't be injected
#                 from Python at parse time). A guard step verifies they agree
#                 and fails loudly if someone changes one without the other.
#   * manual    — workflow_dispatch (Run workflow button).
#
# What it does: installs deps, runs the single end-to-end entry point
# (src/train.py: fetch → features → train → evaluate → save + MLflow), commits
# the refreshed model + reports back, and uploads mlruns/ as a build artifact.
# mlruns/ is NOT committed because MLflow's file store embeds absolute paths
# at creation time — a Windows-built mlruns/ breaks on Linux CI.

on:
  schedule:
    # Keep in sync with config.RETRAIN_CRON ("0 3 * * 1" = 03:00 UTC Mondays).
    - cron: "0 3 * * 1"
  workflow_dispatch:

# Never let two retrains run (and push) at once.
concurrency:
  group: retrain-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show run configuration (city / dates / schedule from config.py)
        run: |
          echo "::group::Training configuration (read from config.py)"
          python - <<'PY'
          import config
          print(f"City              : {config.CITY_NAME} ({config.LATITUDE}, {config.LONGITUDE})")
          print(f"Date range        : {config.START_DATE} -> {config.END_DATE}")
          print(f"Test horizon (d)  : {config.TEST_HORIZON_DAYS}")
          print(f"CV splits         : {config.N_CV_SPLITS}")
          print(f"MLflow experiment : {config.MLFLOW_EXPERIMENT_NAME}")
          print(f"Retrain schedule  : {config.RETRAIN_CRON}")
          PY
          echo "::endgroup::"

      - name: Verify workflow cron matches config.RETRAIN_CRON
        run: |
          CONFIG_CRON="$(python -c 'import config; print(config.RETRAIN_CRON)')"
          WORKFLOW_CRON="0 3 * * 1"
          echo "config.RETRAIN_CRON = '$CONFIG_CRON'"
          echo "workflow schedule   = '$WORKFLOW_CRON'"
          if [ "$CONFIG_CRON" != "$WORKFLOW_CRON" ]; then
            echo "::error::Schedule drift: config.RETRAIN_CRON ('$CONFIG_CRON') does not match the cron in retrain.yml ('$WORKFLOW_CRON'). Update both to keep them in sync."
            exit 1
          fi

      - name: Train model (fetch -> features -> train -> evaluate -> save)
        env:
          # If the repo variable MLFLOW_TRACKING_URI is set (Settings → Variables),
          # logs go to that remote server; otherwise train.py falls back to the
          # local ./mlruns store.  NOTE: when the variable is unset this expands
          # to the empty string, which is *present* — so the shell guard in `run`
          # below unsets it, letting train.py's default apply (a bare empty URI
          # would otherwise be handed to MLflow and silently break the fallback).
          MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
        run: |
          echo "::group::python -m src.train"
          # Drop the variable entirely if it came through empty, so train.py
          # uses its committed local-store default instead of an empty URI.
          if [ -z "${MLFLOW_TRACKING_URI}" ]; then
            unset MLFLOW_TRACKING_URI
          fi
          python -m src.train
          echo "::endgroup::"

      - name: Commit refreshed model and reports
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage only the retrain outputs. models/model.joblib needs --force
          # because models/* is git-ignored for local dev; the canonical
          # artifact is version-controlled via the !models/model.joblib negation.
          git add --force models/model.joblib reports/

          if git diff --cached --quiet; then
            echo "No changes to commit — model and metrics are unchanged. Skipping."
            exit 0
          fi

          echo "Changes detected; committing retrain outputs."
          git diff --cached --stat
          git commit -m "chore: weekly model retrain [skip ci]"

          # `actions/checkout` fetches only the triggering commit, so `main` may
          # have advanced since (manual commits interleave the weekly retrains).
          # A plain `git push` would then be rejected as non-fast-forward and
          # fail the job. Rebase our single retrain commit onto the latest remote
          # tip before pushing; the retrain only touches models/model.joblib and
          # reports/ (regenerated wholesale each run), so a rebase won't conflict.
          # One retry covers the narrow window between fetch and push.
          branch="${GITHUB_REF_NAME}"
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin "$branch"
            if git rebase "origin/$branch" && git push origin "HEAD:$branch"; then
              pushed=true
              break
            fi
            echo "Push attempt $attempt failed (branch advanced); retrying…"
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::Could not push retrain outputs after 3 attempts (branch kept advancing)."
            exit 1
          fi

      - name: Upload MLflow runs as build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlruns-${{ github.run_number }}
          path: mlruns/
          retention-days: 30
